<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ラストオーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen visual novel — HUD / stage with heroine / dialogue box. Deliberately single night theme. */
:root{
  --night:#161927;
  --panel:#20243a;
  --panel-2:#2a2f4a;
  --ink:#f3ece0;
  --muted:#a9a7ba;
  --lantern:#f0b35c;
  --rose:#ee7f99;
  --teal:#72c7b6;
  --bad:#ea6b5c;
  --line:rgba(243,236,224,.14);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-pixel:"DotGothic16","Zen Kaku Gothic New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}

.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px;min-height:100%;display:flex;flex-direction:column;gap:12px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-family:var(--f-pixel);font-size:13px}
.hud .chapter{color:var(--lantern);letter-spacing:.08em;flex:1 1 auto;min-width:0}
.hud .lvl{color:var(--muted);margin-right:8px}
.meter{display:flex;align-items:center;gap:8px;position:relative}
.meter .lbl{color:var(--muted);letter-spacing:.06em}
.bar{width:100px;height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .6s ease}
.m-aff .bar i{background:var(--rose)}
.m-tr .bar i{background:var(--teal)}
.meter .num{font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right}
.meter.masked .bar{opacity:.35}
.meter.masked .num{color:var(--muted)}
.counter b{color:var(--lantern);font-weight:400;font-variant-numeric:tabular-nums}
.pop{position:absolute;right:0;top:-18px;font-size:13px;font-weight:700;pointer-events:none;animation:pop 1.4s ease forwards}
.pop.up{color:var(--teal)} .pop.down{color:var(--bad)}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* Stage */
.stage{position:relative;height:clamp(300px,56vh,500px);border-radius:14px;overflow:hidden;border:1px solid var(--line);transition:background .8s}
.stage .place{position:absolute;left:12px;top:10px;font-family:var(--f-pixel);font-size:12px;letter-spacing:.1em;background:rgba(10,12,20,.55);color:var(--ink);padding:2px 10px;border-radius:999px;z-index:2}
.bg-room{background:radial-gradient(circle at 78% 30%,rgba(240,179,92,.35),transparent 30%),linear-gradient(180deg,#2b2a44 0%,#1c1b2e 70%,#141322 100%)}
.bg-izakaya{background:radial-gradient(circle at 15% 22%,rgba(240,120,70,.75) 0 22px,transparent 23px),radial-gradient(circle at 85% 22%,rgba(240,120,70,.75) 0 22px,transparent 23px),radial-gradient(circle at 50% 120%,rgba(240,179,92,.45),transparent 60%),linear-gradient(180deg,#4a2c25 0%,#2c1b1a 100%)}
.bg-cafe{background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 60px),radial-gradient(circle at 70% 20%,rgba(255,230,190,.55),transparent 45%),linear-gradient(180deg,#8a6a4f 0%,#5b4232 100%)}
.bg-bar{background:radial-gradient(circle at 20% 15%,rgba(240,179,92,.5) 0 6px,transparent 7px),radial-gradient(circle at 45% 12%,rgba(240,179,92,.5) 0 6px,transparent 7px),radial-gradient(circle at 70% 15%,rgba(240,179,92,.5) 0 6px,transparent 7px),linear-gradient(180deg,#3a1f2c 0%,#24131d 75%,#5a3322 75%,#3d2218 100%)}
.bg-street{background:radial-gradient(circle at 18% 30%,rgba(255,214,140,.6) 0 5px,rgba(255,214,140,.12) 6px 50px,transparent 51px),radial-gradient(circle at 82% 38%,rgba(255,214,140,.6) 0 5px,rgba(255,214,140,.12) 6px 50px,transparent 51px),linear-gradient(180deg,#0f1530 0%,#1d2547 70%,#262b3e 100%)}
.bg-park{background:radial-gradient(circle at 50% 95%,rgba(255,170,110,.85),transparent 45%),linear-gradient(180deg,#43407a 0%,#b46d7a 65%,#e8a07a 100%)}
.bg-morning{background:linear-gradient(100deg,transparent 0 30%,rgba(255,248,225,.35) 30% 38%,transparent 38% 100%),linear-gradient(180deg,#c9d4e6 0%,#e9dfd2 100%)}
.bg-phone{background:radial-gradient(ellipse at 50% 60%,rgba(114,199,182,.25),transparent 55%),linear-gradient(180deg,#1b2238 0%,#121626 100%)}
.bg-yakiniku{background:radial-gradient(circle at 50% 110%,rgba(255,110,60,.7),transparent 50%),repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 3px,transparent 3px 18px),linear-gradient(180deg,#5a2f22 0%,#33190f 100%)}
.bg-black{background:#07080d}

.her{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%;width:auto;transition:opacity .4s,transform .4s}
.her.hide{opacity:0;transform:translateX(-50%) translateY(10px)}

/* Dialogue */
.box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 18px 16px;min-height:150px;display:flex;flex-direction:column;gap:12px}
.name{position:absolute;top:-13px;left:14px;background:var(--lantern);color:#2a1a08;font-weight:700;font-size:14px;padding:1px 14px;border-radius:6px;letter-spacing:.06em}
.name.narr{background:var(--panel-2);color:var(--muted)}
.name.me{background:var(--teal);color:#0f2620}
.text{font-size:17px;min-height:3.5em;white-space:pre-wrap;cursor:pointer}
.text.narr{color:#d8d3e3}
.hint{align-self:flex-end;font-family:var(--f-pixel);font-size:12px;color:var(--muted);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;line-height:1.6;transition:border-color .15s,background .15s,transform .15s}
.choice:hover{border-color:var(--lantern);background:#323858}
.choice:active{transform:scale(.99)}
.choice .k{font-family:var(--f-pixel);color:var(--lantern);flex:0 0 auto}
.choice span:last-child{min-width:0}

.coach{border-radius:10px;padding:12px 14px;background:var(--night);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.coach .head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-pixel);font-size:13px}
.grade{padding:1px 10px;border-radius:999px;font-weight:700;color:#1a1420}
.g-good{background:var(--teal)} .g-ok{background:var(--lantern)} .g-bad{background:var(--bad)}
.coach .delta{color:var(--muted);font-variant-numeric:tabular-nums}
.coach p{margin:0;font-size:15px;line-height:1.8}
.coach .tag{font-family:var(--f-pixel);color:var(--muted);font-size:12px;letter-spacing:.1em}
.next{align-self:flex-end;background:var(--lantern);color:#2a1a08;border:0;border-radius:8px;padding:8px 20px;font-weight:700;cursor:pointer}
.next:hover{filter:brightness(1.08)}

/* Title */
.title{display:flex;flex-direction:column;gap:22px;padding-block:24px}
.title .eyebrow{font-family:var(--f-pixel);color:var(--lantern);letter-spacing:.2em;font-size:13px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,12vw,88px);line-height:1.05;margin:0;letter-spacing:.02em;text-wrap:balance}
.title h1 em{font-style:normal;color:var(--rose)}
.title .lead{margin:0;max-width:34em;color:#ddd6e6}
.clock{font-family:var(--f-pixel);font-size:14px;color:var(--muted);margin:0}
.clock b{color:var(--lantern);font-weight:400}
.namebox{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);max-width:14em}
.namebox input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);font:inherit;font-size:16px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.lv{--c:var(--teal);display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.lv:hover{border-color:var(--c);background:#262a44;transform:translateY(-2px)}
.lv .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-pixel);font-size:13px}
.lv .tier{color:var(--c);letter-spacing:.12em}
.lv .stars{color:var(--c);letter-spacing:.1em}
.lv h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.3}
.lv .who{font-size:13px;color:var(--c)}
.lv p{margin:0;font-size:14px;color:#d6d0e0;line-height:1.7}
.lv .foot{display:flex;justify-content:space-between;gap:8px;margin-top:4px;padding-top:8px;border-top:1px solid var(--line);font-family:var(--f-pixel);font-size:12px;color:var(--muted)}
.lv .foot b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.lv-1{--c:var(--teal)} .lv-2{--c:var(--lantern)} .lv-3{--c:var(--rose)} .lv-4{--c:var(--bad)}
.btn{background:var(--rose);color:#2a0f18;border:0;border-radius:8px;padding:10px 26px;font-weight:700;cursor:pointer;font-size:16px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:0;max-width:44em}

/* Ending */
.ending{display:flex;flex-direction:column;gap:18px;padding-block:8px}
.rank{font-family:var(--f-pixel);letter-spacing:.2em;font-size:14px}
.ending h2{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,8vw,52px);line-height:1.15;margin:0;text-wrap:balance}
.ending .story p{margin:0 0 .8em;max-width:36em}
.t-good .rank{color:var(--teal)} .t-normal .rank{color:var(--lantern)} .t-bad .rank,.t-over .rank{color:var(--bad)}
.t-over h2{color:var(--bad)}
.final{display:flex;flex-wrap:wrap;gap:12px 24px;font-family:var(--f-pixel);font-size:14px}
.final b{font-weight:400;color:var(--lantern);font-variant-numeric:tabular-nums}
.sec h3{font-family:var(--f-pixel);font-weight:400;font-size:14px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px}
.report{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.report li{display:grid;grid-template-columns:2.2em 7.5em 1fr;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.report .mk{font-family:var(--f-pixel);font-size:16px;text-align:center}
.report .q{color:var(--muted);font-size:13px}
.report .c{min-width:0}
.report .why{grid-column:3;font-size:13px;color:var(--muted);line-height:1.7}
.mk.good{color:var(--teal)} .mk.ok{color:var(--lantern)} .mk.bad{color:var(--bad)}
.lessons{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.lessons b{color:var(--lantern);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px}

@media (max-width:480px){
  .bar{width:64px}
  .levels{grid-template-columns:1fr}
  .report li{grid-template-columns:2em 1fr}
  .report .c,.report .why{grid-column:2}
  .text{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

  const n = parseInt(hex.slice(1),16); let r=n>>16, g=n>>8&255, b=n&255;

  r=Math.round(r+(t-r)*k); g=Math.round(g+(t-g)*k); b=Math.round(b+(t-b)*k);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

const CHARS = {

function eyeSVG(x, mirror, lid, c, id){
  const ink = shade(c.hair,-.45);
  const iy = lid<-6 ? 1 : 2.5;
  const wing = lid<-6 ? -7 : -4;
  const hl = lid<-6 ? -3 : 0;
  return `<g transform="translate(${x} 112) scale(${mirror*1.22} 1.22)">
    <ellipse cx="-2" cy="${lid*.55-1}" rx="14" ry="6" fill="url(#${id}shadow)"/>
    <path d="M11 0 Q0 ${lid} -12 -2 Q-2 10.5 11 0 Z" fill="#fffaf6"/>
    <g clip-path="url(#${id}eye${lid})">
      <ellipse cx="-1" cy="${iy}" rx="7.2" ry="8.6" fill="url(#${id}iris)"/>
      <ellipse cx="-1" cy="${iy+.5}" rx="3.2" ry="4.4" fill="${shade(c.eye,-.65)}"/>
      <path d="M11 0 Q0 ${lid} -12 -2" fill="none" stroke="${shade(c.skin,-.35)}" stroke-opacity=".35" stroke-width="3"/>
      <circle cx="-3.6" cy="${hl-1}" r="2.3" fill="#fff"/>
      <circle cx="2.4" cy="${iy+3.5}" r="1.1" fill="#fff" opacity=".85"/>
    </g>
    <path d="M12.5 1.5 Q0 ${lid-3} -12 -3.5 L-17 ${wing} Q-15.5 -.5 -12 .5 Q0 ${lid+1} 11.5 2 Z" fill="${ink}"/>
    <path d="M9 -3 Q-1 ${lid-6} -12 ${lid<-6?-6:-4.5}" fill="none" stroke="${ink}" stroke-opacity=".45" stroke-width="1"/>
    <path d="M-11 2 Q-1 10 9 3.5" fill="none" stroke="${ink}" stroke-opacity=".25" stroke-width="1"/>
  </g>`;
}

function drawHer(k, mood, aff){
  const c = CHARS[k], h = HAIR[c.style], id = 'h'+k;
  mood = LID[mood]!==undefined ? mood : 'neutral';
  const lid = LID[mood];
  const blush = mood==='blush' ? .9 : (aff>=65 && mood==='smile' ? .6 : .3);
  const sk = c.skin, skD = shade(sk,-.12), skS = shade(sk,-.3);
  const hairD = shade(c.hair,-.35), hairL = shade(c.hair,.28);
  const lips = LIPS[mood];
  const browCol = shade(c.hair,-.1);

  const defs = `<defs>
    <linearGradient id="${id}hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hairL}"/><stop offset=".45" stop-color="${c.hair}"/><stop offset="1" stop-color="${hairD}"/></linearGradient>
    <linearGradient id="${id}skin" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="320"><stop offset="0" stop-color="${shade(sk,.04)}"/><stop offset="1" stop-color="${skD}"/></linearGradient>
    <linearGradient id="${id}cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(c.cloth,.14)}"/><stop offset="1" stop-color="${shade(c.cloth,-.28)}"/></linearGradient>
    <radialGradient id="${id}iris" cx=".5" cy=".7" r=".65"><stop offset="0" stop-color="${shade(c.eye,.45)}"/><stop offset=".55" stop-color="${c.eye}"/><stop offset="1" stop-color="${shade(c.eye,-.55)}"/></radialGradient>
    <radialGradient id="${id}blush"><stop offset="0" stop-color="#f26a8a" stop-opacity=".85"/><stop offset="1" stop-color="#f26a8a" stop-opacity="0"/></radialGradient>
    <radialGradient id="${id}lip" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="${shade(c.lip,.12)}"/><stop offset="1" stop-color="${shade(c.lip,-.18)}"/></radialGradient>
    <radialGradient id="${id}shadow" cx=".45" cy=".6" r=".55"><stop offset="0" stop-color="${c.shadow||shade(c.lip,-.05)}" stop-opacity=".45"/><stop offset="1" stop-color="${c.shadow||shade(c.lip,-.05)}" stop-opacity="0"/></radialGradient>
    <clipPath id="${id}eye${lid}"><path d="M11 0 Q0 ${lid} -12 -2 Q-2 10.5 11 0 Z"/></clipPath>
  </defs>`;

  const ear = c.ear ? (c.ear.type==='drop'
      ? `<g stroke="${c.ear.color}" stroke-width="1" fill="${c.ear.color}"><path d="M61 121 L61 133 M139 121 L139 133"/><path d="M61 133 Q58 138 61 141 Q64 138 61 133 Z M139 133 Q136 138 139 141 Q142 138 139 133 Z"/></g>`
      : c.ear.type==='hoop'
      ? `<g fill="none" stroke="${c.ear.color}" stroke-width="1.6"><circle cx="61" cy="129" r="5.5"/><circle cx="139" cy="129" r="5.5"/></g>`
      : `<g fill="${c.ear.color}"><circle cx="61" cy="122" r="2.2"/><circle cx="139" cy="122" r="2.2"/></g>`) : '';

  const necklace = c.necklace ? `<path d="M83 190 Q100 210 117 190" fill="none" stroke="${c.necklace}" stroke-width=".9"/><path d="M100 203 L97.5 207 L100 211 L102.5 207 Z" fill="${c.necklace}"/>` : '';

  const glasses = c.glasses ? `<g fill="#ffffff" fill-opacity=".08" stroke="${shade(c.hair,-.1)}" stroke-width="1.1">
      <rect x="66" y="101" width="27" height="20" rx="8"/><rect x="107" y="101" width="27" height="20" rx="8"/></g>
      <path d="M93 108 Q100 105 107 108 M66 107 L58 104 M134 107 L142 104" fill="none" stroke="${shade(c.hair,-.1)}" stroke-width="1.4"/>
      <path d="M70 104 L76 104 M111 104 L117 104" stroke="#fff" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round"/>` : '';

  return defs
   + (h.tail?`<path d="${h.tail}" fill="url(#${id}hair)"/>`:'')
   + `<path d="${h.back}" fill="url(#${id}hair)"/>`
   // body (waist-up)
   + `<path d="${BODY}" fill="url(#${id}skin)"/>`
   + `<path d="M88 150 Q100 170 112 150 L112 165 Q100 177 88 165 Z" fill="${skS}" opacity=".35"/>`
   + `<path d="M72 198 Q84 193 95 199 M105 199 Q116 193 128 198" fill="none" stroke="${skS}" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>`
   + `<path d="M57 228 C55 240 53 252 52 264 M143 228 C145 240 147 252 148 264 M66 262 C69 274 70 286 66 304 M134 262 C131 274 130 286 134 304" fill="none" stroke="${skS}" stroke-opacity=".3" stroke-width="1.2"/>`
   + `<path d="M100 262 Q99 271 100 279" fill="none" stroke="${skS}" stroke-opacity=".2" stroke-width="1"/><ellipse cx="100" cy="285" rx="1.4" ry="2.6" fill="${skS}" opacity=".6"/>`
   + OUTFIT[c.outfit](id, c)
   + necklace
   // face
   + `<path d="M62 98 C62 128 73 146 88 156 C95 161 105 161 112 156 C127 146 138 128 138 98 C138 66 121 50 100 50 C79 50 62 66 62 98 Z" fill="url(#${id}skin)"/>`
   + `<path d="M62 100 C63 126 73 144 88 155 C77 145 67 128 66 100 Z" fill="${skS}" opacity=".18"/>`
   + `<ellipse cx="77" cy="128" rx="12" ry="6.5" fill="url(#${id}blush)" opacity="${blush}"/><ellipse cx="123" cy="128" rx="12" ry="6.5" fill="url(#${id}blush)" opacity="${blush}"/>`
   + (mood==='blush' ? `<path d="M71 127 L74 124 M75 128 L78 125 M117 127 L120 124 M121 128 L124 125" stroke="#e05a7a" stroke-opacity=".6" stroke-width=".9" stroke-linecap="round"/>` : '')
   + eyeSVG(79, 1, lid, c, id) + eyeSVG(121, -1, lid, c, id)
   + `<g fill="none" stroke="${browCol}" stroke-width="1.5" stroke-linecap="round"><path transform="translate(79 112) scale(1.15)" d="${BROW[mood]}"/><path transform="translate(121 112) scale(-1.15 1.15)" d="${BROW[mood]}"/></g>`
   + `<path d="M102 124 Q104.5 129.5 100.5 131" fill="none" stroke="${skS}" stroke-opacity=".7" stroke-width="1.1" stroke-linecap="round"/>`
   + `<g transform="translate(100 143) scale(1.08 1.22) translate(-100 -143)"><path d="${lips.u}" fill="url(#${id}lip)"/><path d="${lips.l}" fill="url(#${id}lip)"/>`
   + `<path d="${lips.line}" fill="none" stroke="${shade(c.lip,-.45)}" stroke-width="${lips.gap?1.4:.9}" stroke-linecap="round"/>`
   + `<ellipse cx="101.5" cy="${mood==='blush'?145.6:144.4}" rx="2.2" ry=".7" fill="#fff" opacity=".45"/></g>`
   + (c.mole?`<circle cx="130" cy="124" r=".95" fill="${shade(c.hair,-.2)}"/>`:'')
   // front hair
   + `<path d="${h.bangs}" fill="url(#${id}hair)"/>`
   + (h.front?`<path d="${h.front}" fill="url(#${id}hair)"/>`:'')
   + `<path d="${h.strands}" fill="none" stroke="${hairD}" stroke-opacity=".14" stroke-width="1" stroke-linecap="round"/>`
   + `<path d="M78 54 Q100 46 122 54" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="3" stroke-linecap="round"/>`
   + (c.style==='pony'?`<circle cx="138" cy="62" r="4" fill="${c.acc}"/>`:'')
   + glasses + ear;
}

const SCEN = [BEGINNER, MIDDLE, ADVANCED, EXPERT];
const SC = Object.fromEntries(SCEN.map(s=>[s.id,s]));

// ============================================================
// Engine
// ============================================================
const app = document.getElementById('app');
const clamp = v => Math.max(0, Math.min(100, v));
let S = null;            // game state (kept across hot reloads)
let ui = {};
let lines = [], li = 0, typing = null, phase = 'title', order = null;

const fmt = s => String(s).replace(/\{name\}/g, (S && S.name) || 'ハルト').replace(/\{n\}/g, S ? S.n : 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sc = () => SC[S.scen];
const node = id => sc().nodes[id || S.node];

function loadCleared(){ try{ return JSON.parse(localStorage.getItem('lastorder-cleared')||'{}'); }catch(e){ return {}; } }
function saveCleared(scen, end){
  try{ const c = loadCleared(); c[scen] = Array.from(new Set([...(c[scen]||[]), end])); localStorage.setItem('lastorder-cleared', JSON.stringify(c)); }catch(e){}
}
function loadName(){ try{ return localStorage.getItem('lastorder-name') || 'ハルト'; }catch(e){ return 'ハルト'; } }
function saveName(n){ try{ localStorage.setItem('lastorder-name', n); }catch(e){} }

function fresh(scen, name){ return {scen, name:name||'ハルト', a:0, t:0, n:0, flags:{}, log:[], node:null, v:Math.random()<.5?'A':'B'}; }
const HIDE_LABEL = ['判定：その場で表示','判定：コメントのみ','判定：最後に答え合わせ'];

function titleScreen(){
  phase='title'; S=null;
  const cleared = loadCleared();
  const cards = SCEN.map(s=>{
    const total = Object.values(s.nodes).filter(n=>n.ending).length;
    const got = (cleared[s.id]||[]).length;
    return `<button class="lv lv-${s.lv}" type="button" data-scen="${s.id}">
      <div class="top"><span class="tier">${s.tier}</span><span class="stars">${'★'.repeat(s.lv)}${'☆'.repeat(4-s.lv)}</span></div>
      <h3>${esc(s.title)}</h3>
      <div class="who">${esc(s.who)}</div>
      <p>${esc(s.desc)}</p>
      <div class="foot"><span>${HIDE_LABEL[s.hide]}</span><span>エンディング <b>${got}/${total}</b></span></div>
    </button>`;
  }).join('');
  app.innerHTML = `
  <section class="title">
    <div class="eyebrow">恋愛シミュレーション ／ 全4コース</div>
    <h1>ラスト<br><em>オーダー</em></h1>
    <p class="clock">PM 10:30 ― ラストオーダー、終電まで <b>あと90分</b></p>
    <p class="lead">彼女いない歴＝年齢、29歳。出会いから、デート、夜の「このあと」、翌朝まで。女はそんなに単純じゃない。表情とサインを読んで、選んでください。</p>
    <label class="namebox" for="pname">主人公の名前<input id="pname" maxlength="8" value="${esc(loadName())}" autocomplete="off"></label>
    <div class="levels">${cards}</div>
    <p class="note">解説役は、恋愛の本音をズバズバ言う女友達。難易度が上がるほど判定が隠れ、その日の彼女の機嫌や性格で正解が変わります。性的な描写はありません。</p>
  </section>`;
  app.querySelectorAll('.lv').forEach(b=>b.addEventListener('click', ()=>{
    const n = document.getElementById('pname').value.trim() || 'ハルト';
    saveName(n);
    S = fresh(b.dataset.scen, n);
    buildGame();
    goto(sc().start);
  }));
  window.scrollTo(0,0);
}

function buildGame(){
  const s = sc();
  app.innerHTML = `
  <div class="hud">
    <div class="chapter"><span class="lvl">${s.tier}</span><span id="chap"></span></div>
    <div class="meter m-aff"><span class="lbl">${s.meters[0]}</span><span class="bar"><i id="barA"></i></span><span class="num" id="numA">0</span></div>
    <div class="meter m-tr"><span class="lbl">${s.meters[1]}</span><span class="bar"><i id="barT"></i></span><span class="num" id="numT">0</span></div>
    ${s.counter?`<div class="meter counter"><span class="lbl">${s.counter}</span><b id="numN">0</b></div>`:''}
  </div>
  <div class="stage" id="stage">
    <span class="place" id="place"></span>
    <svg class="her hide" id="her" viewBox="0 0 200 320" role="img"></svg>
  </div>
  <div class="box" id="box">
    <div class="name" id="name"></div>
    <div class="text" id="text" tabindex="0" role="button" aria-live="polite"></div>
    <div class="hint" id="hint">▼ タップで次へ</div>
    <div class="choices" id="choices"></div>
  </div>`;
  ui = Object.fromEntries(['chap','barA','barT','numA','numT','numN','stage','place','her','box','name','text','hint','choices'].map(id=>[id,document.getElementById(id)]));
  if(s.hide>=2) app.querySelectorAll('.m-aff,.m-tr').forEach(m=>m.classList.add('masked'));
  ui.text.addEventListener('click', advance);
  ui.stage.addEventListener('click', advance);
  updateHud();
}

function updateHud(prevA, prevT, prevN){
  const masked = sc().hide>=2;
  ui.barA.style.width = (masked?0:S.a)+'%'; ui.numA.textContent = masked?'？':S.a;
  ui.barT.style.width = (masked?0:S.t)+'%'; ui.numT.textContent = masked?'？':S.t;
  if(ui.numN) ui.numN.textContent = S.n + '人';
  if(sc().hide>=1) prevA = prevT = undefined;
  if(prevA!==undefined) popDelta(ui.barA.closest('.meter'), S.a-prevA);
  if(prevT!==undefined) popDelta(ui.barT.closest('.meter'), S.t-prevT);
  if(prevN!==undefined && ui.numN) popDelta(ui.numN.closest('.meter'), S.n-prevN);
}
function popDelta(el, d){
  if(!d) return;
  const p = document.createElement('span');
  p.className = 'pop ' + (d>0?'up':'down');
  p.textContent = (d>0?'+':'') + d;
  el.appendChild(p); setTimeout(()=>p.remove(), 1500);
}

function setScene(n){
  ui.stage.className = 'stage bg-' + n.bg;
  ui.place.textContent = fmt(n.place||'');
  ui.place.hidden = !n.place;
  ui.chap.textContent = n.ch;
}
function herKey(n){ return n.her===undefined ? sc().her : n.her; }
function showHer(n, mood){
  const k = herKey(n);
  const on = !!k && n.bg!=='black';
  ui.her.classList.toggle('hide', !on);
  if(!on) return;
  ui.her.innerHTML = drawHer(k, mood||'neutral', S.a);
  ui.her.setAttribute('aria-label', CHARS[k].name);
}

function goto(id){
  S.node = id; li = 0; order = null;
  const n = node(id);
  if(n.ending){ endingScreen(id, n); return; }
  if(n.onEnter && !S.entered?.[id]){ S.entered = Object.assign({}, S.entered, {[id]:true}); n.onEnter(S); updateHud(); }
  setScene(n);
  lines = typeof n.lines==='function' ? n.lines(S) : n.lines;
  phase = 'lines';
  showLine();
}

function speak(who, txt, mood){
  const n = node();
  const name = fmt(WHO[who]||'');
  ui.name.textContent = name || 'ナレーション';
  ui.name.classList.toggle('narr', !name);
  ui.name.classList.toggle('me', who==='H');
  ui.text.classList.toggle('narr', !name);
  showHer(n, mood || n.mood);
  type(fmt(txt));
}

function type(str){
  clearInterval(typing); typing=null;
  ui.hint.hidden = true;
  ui.text.dataset.full = str;
  if(reduced){ ui.text.textContent = str; doneTyping(); return; }
  let i = 0; ui.text.textContent = '';
  typing = setInterval(()=>{
    i += 1; ui.text.textContent = str.slice(0,i);
    if(i>=str.length){ clearInterval(typing); typing=null; doneTyping(); }
  }, 28);
}
function doneTyping(){
  if(phase!=='lines') return;
  if(li===lines.length-1){ ui.hint.hidden = true; showChoices(); }
  else ui.hint.hidden = false;
}

function showLine(){
  const [w,txt,mood] = lines[li];
  ui.choices.innerHTML = '';
  speak(w, txt, mood);
}

function advance(){
  if(phase!=='lines' && phase!=='result') return;
  if(typing){ clearInterval(typing); typing=null; ui.text.textContent = ui.text.dataset.full; doneTyping(); return; }
  if(phase==='lines' && li < lines.length-1){ li++; showLine(); }
}

function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

function showChoices(){
  const n = node();
  if(!order) order = n.choices.length>1 ? shuffle(n.choices.map((_,i)=>i)) : [0];
  ui.choices.innerHTML = '';
  order.forEach((ci,k)=>{
    const c = n.choices[ci];
    const b = document.createElement('button');
    b.className = 'choice'; b.type = 'button';
    b.innerHTML = `<span class="k">${n.choices.length>1?(k+1):'▶'}</span><span>${esc(fmt(c.t))}</span>`;
    b.addEventListener('click', ()=>choose(ci));
    ui.choices.appendChild(b);
  });
  phase = 'choices';
}

function choose(ci){
  if(phase!=='choices') return;
  const n = node();
  const c = n.choices[ci];
  const out = Object.assign({}, c, c.dyn ? c.dyn(S) : {});
  const pa = S.a, pt = S.t, pn = S.n;
  S.a = clamp(S.a + (out.a||0));
  S.t = clamp(S.t + (out.tr||0));
  S.n += (out.n||0);
  if(out.set) Object.assign(S.flags, out.set);
  if(n.q) S.log.push({q:n.q, t:fmt(c.t), g:out.g, c:fmt(out.c||'')});
  updateHud(pa, pt, pn);
  let next = out.next || n.next;
  if(typeof next==='function') next = next(S);
  S.pending = next;
  phase = 'result';
  ui.choices.innerHTML = '';
  if(out.r){ speak(out.r[0], out.r[1], out.r[2]); }
  renderCoach(out, S.a-pa, S.t-pt);
}

function renderCoach(out, da, dt){
  const s = sc();
  const gmap = {good:['◎ よい選択','g-good'], ok:['○ 惜しい','g-ok'], bad:['× NG','g-bad']};
  const [gl, gc] = gmap[out.g] || gmap.ok;
  const sgn = d => (d>0?'+':'') + d;
  const delta = (da||dt) ? `${s.meters[0]} ${sgn(da)} ／ ${s.meters[1]} ${sgn(dt)}` : '';
  const isSingle = node().choices.length===1;
  const showGrade = s.hide===0 && !isSingle;
  ui.choices.innerHTML = s.hide>=2 ? '' : `
   <div class="coach">
     <div class="head">${showGrade?`<span class="grade ${gc}">${gl}</span><span class="delta">${delta}</span>`:'<span class="tag">女友達の本音</span>'}</div>
     <p>${esc(fmt(out.c||''))}</p>
   </div>`;
  const b = document.createElement('button');
  b.className='next'; b.type='button'; b.textContent='次へ ▶';
  b.addEventListener('click', ()=>{ const p=S.pending; S.pending=null; goto(p); });
  ui.choices.appendChild(b);
}

function endingScreen(id, n){
  phase = 'ending';
  clearInterval(typing); typing=null;
  const s = sc();
  saveCleared(s.id, id);
  const total = Object.values(s.nodes).filter(x=>x.ending).length;
  const got = (loadCleared()[s.id]||[]).length;
  const cnt = {good:0,ok:0,bad:0};
  S.log.forEach(l=>cnt[l.g]=(cnt[l.g]||0)+1);
  const mk = {good:'◎',ok:'○',bad:'×'};
  app.innerHTML = `
  <section class="ending t-${n.tone}">
    <div class="rank">${s.tier}「${esc(s.title)}」 ― ${n.rank}</div>
    <h2>${esc(fmt(n.title))}</h2>
    <div class="story">${n.text.map(p=>`<p>${esc(fmt(p))}</p>`).join('')}</div>
    <div class="final">
      <span>${s.meters[0]} <b>${S.a}</b></span><span>${s.meters[1]} <b>${S.t}</b></span>
      ${s.counter?`<span>${s.counter} <b>${S.n}人</b></span>`:''}
      <span>◎ <b>${cnt.good}</b>　○ <b>${cnt.ok}</b>　× <b>${cnt.bad}</b></span>
      <span>エンディング回収 <b>${got}/${total}</b></span>
    </div>
    <div class="sec">
      <h3>答え合わせ</h3>
      <ul class="report">${S.log.map(l=>`<li><span class="mk ${l.g}">${mk[l.g]}</span><span class="q">${esc(l.q)}</span><span class="c">${esc(l.t)}</span>${l.c?`<span class="why">${esc(l.c)}</span>`:''}</li>`).join('')}</ul>
    </div>
    <div class="sec">
      <h3>このコースのポイント</h3>
      <ol class="lessons">${s.lessons.map(([h,d])=>`<li><b>${esc(h)}</b>　${esc(d)}</li>`).join('')}</ol>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="again">もう一度プレイ</button>
      <button class="btn ghost" type="button" id="toTitle">コース選択へ</button>
    </div>
  </section>`;
  document.getElementById('again').addEventListener('click', ()=>{ S = fresh(S.scen, S.name); buildGame(); goto(sc().start); });
  document.getElementById('toTitle').addEventListener('click', titleScreen);
  window.scrollTo(0,0);
}

// keyboard: Enter/Space advance, 1-4 choose
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(phase==='choices' && /^[1-4]$/.test(e.key)){
    const btn = ui.choices.querySelectorAll('.choice')[+e.key-1];
    if(btn){ e.preventDefault(); btn.click(); }
  } else if((e.key==='Enter'||e.key===' ') && (phase==='lines'||phase==='result') && e.target.tagName!=='BUTTON'){
    e.preventDefault();
    if(phase==='result' && !typing){ const nb = ui.choices.querySelector('.next'); if(nb) nb.click(); }
    else advance();
  }
});

// hot reload: keep progress when the page updates
window.claude?.hot?.snapshot?.(()=>({S}));
function start(data){
  if(data && data.S && data.S.node && data.S.scen && SC[data.S.scen]){
    S = data.S; buildGame();
    if(S.pending){ const p=S.pending; S.pending=null; goto(p); } else goto(S.node);
  } else titleScreen();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
